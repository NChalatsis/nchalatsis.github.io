<head>
  <meta charset="utf-8">

  <title>
    {% if page.title %}
      {{ page.title }} - {{ site.title }}
    {% else %}
      {{ site.title }}{% if site.subtitle %} - {{ site.subtitle }}{% endif %}
    {% endif %}
  </title>

  <meta name="viewport" content="width=device-width, initial-scale=1">

  {% if page.summary %}
    <meta
      name="description"
      content="{{ page.summary | escape }}"
    >
  {% else %}
    <meta
      name="description"
      content="{{ site.description | escape }}"
    >
  {% endif %}

  <meta
    name="keywords"
    content="{% if page.keywords %}{{ page.keywords | escape }}{% else %}Data Engineer, Python, SQL, ETL, ELT, Data Engineering, Data Pipelines{% endif %}"
  >

  {% if page.noindex %}
    <meta name="robots" content="noindex">
  {% endif %}

  <!-- Open Graph -->
  <meta property="og:site_name" content="{{ site.title }}">

  {% if page.title %}
    <meta property="og:title" content="{{ page.title }}">
    <meta property="og:type" content="article">
  {% else %}
    <meta property="og:title" content="{{ site.title }}">
    <meta property="og:type" content="website">
  {% endif %}

  {% if page.summary %}
    <meta property="og:description" content="{{ page.summary }}">
  {% else %}
    <meta property="og:description" content="{{ site.description }}">
  {% endif %}

  {% if page.url %}
    <meta property="og:url" content="{{ site.url }}{{ page.url }}">
  {% endif %}

  {% if page.thumbnail %}
    <meta property="og:image" content="{{ site.url }}{{ page.thumbnail }}">
  {% endif %}

  <!-- RSS -->
  <link
    rel="alternate"
    type="application/rss+xml"
    title="RSS"
    href="{{ site.url }}{{ site.baseurl }}/feed.xml"
  >

  <!-- Bootstrap -->
<link
  rel="stylesheet"
  href="{{ site.url }}{{ site.baseurl }}/assets/bower_components/bootstrap/dist/css/bootstrap.min.css"
>

<!-- Main stylesheet -->
<link
  rel="stylesheet"
  href="{{ site.url }}{{ site.baseurl }}/assets/css/main.css"
>

<!-- Custom stylesheet -->
<link
  rel="stylesheet"
  href="{{ site.url }}{{ site.baseurl }}/assets/css/custom-style.css"
>

  <!-- Font Awesome -->
  <link
    rel="stylesheet"
    href="{{ site.url }}{{ site.baseurl }}/assets/bower_components/font-awesome/web-fonts-with-css/css/fontawesome-all.min.css"
  >

  <!-- Icono -->
  <link
    rel="stylesheet"
    href="{{ site.url }}{{ site.baseurl }}/assets/bower_components/icono/dist/icono.min.css"
  >

  <!-- Font -->
  <link
    href="https://fonts.googleapis.com/css?family=Quicksand&display=swap"
    rel="stylesheet"
  >

  <!-- Favicon / browser tab avatar -->
  <link
    rel="icon"
    type="image/png"
    href="{{ site.url }}{{ site.baseurl }}/assets/img/avatar.png"
  >

  <link
    rel="apple-touch-icon"
    href="{{ site.url }}{{ site.baseurl }}/assets/img/avatar.png"
  >

  <script>
    var base_url = '{{ site.url }}{{ site.baseurl }}';
  </script>

  <!-- jQuery -->
  <script
    src="https://code.jquery.com/jquery-3.4.1.min.js"
    integrity="sha384-vk5WoKIaW/vJyUAdn9n/wmopsmNhiy+L2Z+SBxGYnUkunIxVxAv/UtMOhba/xskxh"
    crossorigin="anonymous"
  ></script>

  <!-- Bootstrap -->
  <script src="{{ site.url }}{{ site.baseurl }}/assets/bower_components/bootstrap/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Progress bar -->
  <script src="{{ site.url }}{{ site.baseurl }}/assets/bower_components/nanobar/nanobar.min.js"></script>

  <!-- Scroll progress -->
  <script src="{{ site.url }}{{ site.baseurl }}/assets/js/on-scroll-progress.js"></script>

  {% if page.usemathjax %}
    <script type="text/x-mathjax-config">
      MathJax.Hub.Config({
        TeX: {
          equationNumbers: {
            autoNumber: "AMS"
          }
        }
      });
    </script>

    <script
      type="text/javascript"
      async
      src="https://cdn.mathjax.org/mathjax/latest/MathJax.js?config=TeX-AMS-MML_HTMLorMML"
    ></script>
  {% endif %}
</head>
